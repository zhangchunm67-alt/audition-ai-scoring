# 检测配置 v3（2026-11-10，加入人工打分分工 human_review）。v2（2026-11-09）：P9 改为直接看画面。
# 词表、阈值、抽帧频率、提示词版本、哪些条目由评委打分。改动需要重跑模型（与计分配置分开，T3）。
# pending / calibration_required 标记的含义与计分配置相同：草稿可用于开发测试，正式发布前须清零。
version: detectors-v3
status: draft
asr:
  disfluency_removal: false     # 必须关闭顺滑，保留口头禅
  word_timestamps: true
frames:
  appearance_every_s: 30        # P1 形象：每 30 秒 1 帧
  motion_fps: 1                 # P8 小动作：每秒 1 帧（rubric：1–2 帧）
p2:
  pending: [Q7]                 # 是否加入“嗯、啊、然后、就是、对吧”
  categories:                   # 原评分表 8 类
    - {label: "是……的", pattern: "是[^，。！？；]{1,12}?的"}
    - {label: "一个", pattern: "一个"}
    - {label: "……的情况下/的话", pattern: "的情况下|的话"}
    - {label: "这边给你", pattern: "这边给你"}
    - {label: "那么", pattern: "那么"}
    - {label: "什么呀", pattern: "什么呀"}
    - {label: "懂了吗", pattern: "懂了吗"}
    - {label: "对不对", pattern: "对不对"}
p7:
  pause_ms: 300                 # 停顿：静音 ≥ 0.3 秒
  run_on_ms: 30000              # 连讲：连续 30 秒没有停顿
  stall_gap_ms: 3000            # 卡壳：句中静音 ≥ 3 秒
  objection_grace_ms: 5000      # 弹幕弹出后 5 秒内的停顿不算卡壳
  repetition_patterns: ["(这个){2,}", "(那个){2,}", "不是，是"]
p8:
  pending: [Q11]                # 低头看稿超过 3 秒是否计次
  merge_within_ms: 5000         # 同一动作 5 秒内重复算 1 次
p9:
  # v2：原来只在口播里出现引导语时才看画面，主播不出声地举 KT 板、指屏幕上的贴片全部漏检（盲测两条直播回放 P9 都是 0）。
  # 现在每 scan_every_s 秒抽一帧直接看画面；引导语前后 3 秒的帧额外补看。
  scan_every_s: 3
  guide_phrases: ["看这里", "看屏幕", "左上角", "右上角", "这块板子", "大家看", "看一下", "下方", "屏幕上", "这个界面", "这张"]
  episode_gap_ms: 6000          # 同一块道具的相邻命中帧间隔不超过 6 秒，算同一次使用
  dedupe_within_ms: 60000       # 同一块内容 1 分钟内重复使用只算 1 次
o4:
  dead_air_ms: 5000             # 冷场：静音 ≥ 5 秒
redlines:
  context_chars: 40             # 召回候选句时带上的前后文字数

# 人工打分分工（decisions.md T39）。校准达标前从严：机器评不准或易被主播话术影响的条目由评委打分或确认。
# 校准一致率达标后，可发布新版本把条目从这里移出，交给机器。
# 另外：某个能力没有配置模型（APP_xxx=none，或生产环境下的 Mock）时，依赖它的条目自动转为人工打分。
human_review:
  manual: [P3]                              # 人设塑造·普通话标准：尚无真实普通话评测
  confirm: [P5, P6, P7, S1, S2, L1, O4]     # 模型直接给等级分的主观条目：机器给建议分，评委确认
  confirm_on_deduction: [P1, P10]           # 人设塑造·形象、嘻嘻哈哈：误判一次就扣 10 / 5 分，判扣分时评委确认
  fallback: true                            # 机器重试后仍评不出的条目转评委打分，而不是整条录像失败
