# 单机部署：docker compose up -d（先按 README 生成 .env）
# 包含 PostgreSQL、Redis、MinIO（S3 兼容、服务端加密）、接口服务、处理 worker。
# 镜像都有 linux/arm64 版本，可直接在 Apple 芯片的 Mac 上运行（见 README“在 Mac Studio 上部署”）。
# 视频等媒体存放在宿主机目录 MEDIA_DIR（默认 ./data/minio，MinIO 加密后的文件），便于用 scripts/backup.sh 同步到 NAS。
# 生产环境可把 MinIO 换成阿里云 OSS / 腾讯云 COS 等境内 S3 兼容服务，改 .env 里的 APP_S3_* 即可。
x-app: &app
  build:
    context: .
    network: host
  image: audition-ai-scoring:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://audition:${POSTGRES_PASSWORD}@postgres/audition
    APP_REDIS_URL: redis://redis:6379/0
    APP_QUEUE: rq
    APP_ENV: production
    APP_STORAGE: s3
    APP_S3_ENDPOINT: ${APP_S3_ENDPOINT:-http://minio:9000}
    APP_S3_BUCKET: ${APP_S3_BUCKET:-audition}
    APP_S3_REGION: ${APP_S3_REGION:-cn-local}
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: audition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: audition
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U audition"], interval: 5s, retries: 20}
    restart: unless-stopped

  redis:
    image: redis:7
    volumes: [redisdata:/data]
    restart: unless-stopped

  # 本机试用的 S3 兼容存储。官方 minio/minio 镜像已不在 Docker Hub 提供，这里用 Bitnami 的归档镜像（不再更新）；
  # 正式部署请改用阿里云 OSS、腾讯云 COS 等境内对象存储（改 .env 里的 APP_S3_*，并删掉本服务）。
  minio:
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: audition
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}  # 服务端加密（SSE-S3）用的内置密钥
    volumes: ["${MEDIA_DIR:-./data/minio}:/bitnami/minio/data"]  # 宿主机目录；Linux 上须归 uid 1001 所有
    healthcheck: {test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"], interval: 5s, retries: 30}
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  api:
    <<: *app
    ports: ["${APP_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    <<: *app
    command: ["python", "-m", "app.cli", "worker"]
    deploy: {replicas: 2}
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
  redisdata:
