[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audition-ai-scoring"
version = "0.1.0"
description = "主播试镜 AI 评分系统"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "argon2-cffi>=23",
  "cryptography>=43",
  "PyJWT>=2.9",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "rq>=1.16",
  "redis>=5",
  "numpy>=1.26",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "moto[s3]>=5"]
local = ["sherpa-onnx>=1.10"]  # 本地语音识别、笑声检测（scripts/download_models.sh 下载模型）

[tool.setuptools.packages.find]
include = ["scoring*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
pythonpath = [".", "backend"]
testpaths = ["tests", "backend/tests"]
markers = ["human_review: 保留检测配置里的人工打分分工（默认测试关掉）"]
